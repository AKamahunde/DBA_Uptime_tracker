{% extends 'base.html' %}

{% block title %}Login - DBTRAC{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<style>
    .login-spinner-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 32, 91, 0.2);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .login-spinner-overlay.active {
        display: flex;
    }
    .login-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #00205B;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    .login-spinner-text {
        margin-top: 1rem;
        color: #00205B;
        font-size: 0.95rem;
        font-weight: 600;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .login-wrapper {
        min-height: calc(100vh - 80px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
    }
    .login-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        padding: 2.25rem 2rem;
        box-sizing: border-box;
    }
    .login-card-logo {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1.25rem;
    }
    .login-card-logo img {
        height: 52px;
        width: auto;
        object-fit: contain;
    }
    .login-title {
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #00205B;
        margin: 0;
        text-align: center;
    }
    .login-subtitle {
        text-align: center;
        color: #64748b;
        font-size: 0.78rem;
        font-weight: 500;
        margin: 0.4rem 0 1.75rem 0;
        line-height: 1.4;
    }
    .form-group-custom {
        margin-bottom: 1.15rem;
        text-align: left;
    }
    .form-group-custom label {
        display: block;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #475569;
        margin-bottom: 0.35rem;
    }
    .form-group-custom input {
        width: 100%;
        padding: 0.65rem 0.85rem;
        font-size: 0.9rem;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
        color: #0f172a;
        transition: all 0.2s ease;
    }
    .form-group-custom input:focus {
        outline: none;
        border-color: #00205B;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(0, 32, 91, 0.12);
    }
    .btn-signin {
        width: 100%;
        padding: 0.7rem;
        background: #00205B;
        color: #ffffff;
        font-size: 0.92rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 6px -1px rgba(0, 32, 91, 0.2);
        transition: all 0.2s ease;
        margin-top: 0.5rem;
    }
    .btn-signin:hover {
        background: #001742;
        box-shadow: 0 6px 12px -2px rgba(0, 32, 91, 0.3);
    }
    .btn-signin:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }
    .login-footer-tag {
        font-size: 0.75rem;
        color: #94a3b8;
        text-align: center;
        margin-top: 1.25rem;
        letter-spacing: 0.02em;
    }
</style>

<div class="login-spinner-overlay" id="loginSpinner">
    <div class="login-spinner"></div>
    <div class="login-spinner-text">Logging in, please wait…</div>
</div>

<div class="login-wrapper">
    <!-- Modern Enterprise Card with Integrated NMS Logo -->
    <div class="login-card">
        <div class="login-card-logo">
            <img src="/static/logo.jpg" alt="National Medical Stores Logo">
        </div>
        <h1 class="login-title">DBTRAC</h1>
        <p class="login-subtitle">Database Tracking for Reliability, Administration and Compliance</p>

        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="form-group-custom">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
            </div>
            <div class="form-group-custom">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-signin" id="loginBtn">Sign In</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function() {
        document.getElementById('loginSpinner').classList.add('active');
        document.getElementById('loginBtn').disabled = true;
        document.getElementById('loginBtn').textContent = 'Signing in…';
    });
</script>
{% endblock %}
