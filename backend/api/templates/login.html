{% extends 'base.html' %}

{% block title %}Login - Database Management Hub{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<style>
    /* Premium Light-Themed Login Page */
    body {
        background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%) !important;
        color: #1e293b !important;
        position: relative;
        min-height: 100vh;
    }

    .login-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 85vh;
        padding: 2rem 1rem;
    }

    .login-spinner-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.85);
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
    }
    .login-spinner-overlay.active {
        display: flex;
    }
    .login-spinner {
        width: 52px;
        height: 52px;
        border: 4px solid #e2e8f0;
        border-top-color: #002569;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    .login-spinner-text {
        margin-top: 1rem;
        font-family: 'Segoe UI', sans-serif;
        color: #002569;
        font-size: 1.05rem;
        font-weight: 600;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    .login-title {
        text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 2.3rem;
        font-weight: 300;
        letter-spacing: 1.5px;
        color: #002569 !important;
        margin-bottom: 2rem;
    }
    .login-title span {
        color: #F1AB00;
        font-weight: 800;
    }

    /* Premium Light Card */
    .login-card {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        box-shadow: 0 10px 30px rgba(0, 37, 105, 0.08) !important;
        padding: 2.5rem 2.25rem !important;
        width: 100%;
        max-width: 420px;
        text-align: center;
        transition: transform 0.3s ease;
    }

    .logo-container {
        margin-bottom: 1.75rem;
    }

    .logo-container img {
        max-width: 140px;
        height: auto;
        display: block;
        margin: 0 auto;
    }

    .login-card h2 {
        color: #002569 !important;
        font-size: 1.4rem !important;
        margin-bottom: 1.5rem !important;
        font-weight: 600 !important;
        border: none !important;
        padding: 0 !important;
        letter-spacing: 0.5px;
    }

    .form-group {
        margin-bottom: 1.25rem;
        text-align: left;
    }

    .form-group label {
        color: #475569 !important;
        font-weight: 600 !important;
        display: block !important;
        margin-bottom: 0.4rem !important;
        font-size: 0.9rem !important;
    }

    .form-group input {
        background: #ffffff !important;
        border: 1px solid #cbd5e1 !important;
        color: #1e293b !important;
        border-radius: 6px !important;
        padding: 0.7rem 0.9rem !important;
        width: 100% !important;
        font-size: 0.95rem !important;
        transition: all 0.2s ease !important;
        outline: none !important;
    }

    .form-group input:focus {
        border-color: #002569 !important;
        box-shadow: 0 0 0 3px rgba(0, 37, 105, 0.12) !important;
    }

    .btn-login {
        background: #002569 !important;
        color: #ffffff !important;
        border: none !important;
        font-weight: 600 !important;
        padding: 0.75rem 1rem !important;
        border-radius: 6px !important;
        font-size: 1rem !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
        box-shadow: 0 4px 12px rgba(0, 37, 105, 0.15) !important;
        width: 100%;
        margin-top: 0.5rem;
    }

    .btn-login:hover {
        background: #003388 !important;
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(0, 37, 105, 0.25) !important;
    }

    .btn-login:active {
        transform: translateY(0);
    }
</style>

<div class="login-spinner-overlay" id="loginSpinner">
    <div class="login-spinner"></div>
    <div class="login-spinner-text">Logging in, please wait…</div>
</div>

<div class="login-container">
    <h1 class="login-title"><span>Database</span> Management Hub</h1>
    
    <div class="login-card">
        <div class="logo-container">
            <img src="/static/logo.jpg" alt="Database Management Hub Logo">
        </div>
        <h2>Sign In</h2>
        <form method="post" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Login</button>
        </form>
        
        <div style="margin-top: 1.5rem; border-top: 1px solid #e2e8f0; padding-top: 1.1rem;">
            <a href="{% url 'about' %}" style="color: #002569; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color 0.2s;" onmouseover="this.style.color='#F1AB00'" onmouseout="this.style.color='#002569'">
                About Database Management Hub
            </a>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function() {
        document.getElementById('loginSpinner').classList.add('active');
        document.getElementById('loginBtn').disabled = true;
        document.getElementById('loginBtn').textContent = 'Logging in…';
    });
</script>
{% endblock %}
