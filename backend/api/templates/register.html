{% extends 'base.html' %}

{% block title %}Register - DBTRAC{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<style>
    .register-logo-container {
        text-align: center;
        margin-top: 3.5rem;
        margin-bottom: 1.5rem;
    }
    .register-logo-container img {
        max-width: 170px;
        height: auto;
    }
    .register-title {
        text-align: center;
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #002569;
        margin-top: 0;
        margin-bottom: 0.35rem;
    }
    .register-subtitle {
        text-align: center;
        color: #475569;
        font-style: italic;
        font-size: 0.88rem;
        margin-bottom: 0;
        font-family: 'Georgia', serif;
        line-height: 1.35;
    }
</style>

<!-- NMS Logo positioned at the top above the card -->
<div class="register-logo-container">
    <img src="/static/logo.jpg" alt="NMS Medical Logistics Logo">
</div>

<!-- Card with DBTRAC Tool Name and Register Form -->
<div class="card" style="max-width: 420px; margin: 0 auto 2.5rem auto; text-align: center; padding: 2.25rem 2rem;">
    <div style="margin-bottom: 1.5rem;">
        <h1 class="register-title"><span style="color: var(--primary-gold, #F2A900);">DB</span>TRAC</h1>
        <p class="register-subtitle">Database Tracking for Reliability, Administration and Compliance</p>
    </div>

    <div style="border-top: 1px solid #e2e8f0; margin-bottom: 1.5rem;"></div>

    <h2 style="font-size: 1.35rem; font-weight: 700; color: #1e293b; margin-bottom: 1.5rem;">Register</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group" style="text-align: left;">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label for="password_confirm">Confirm Password:</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: #64748b;">
        Already have an account? <a href="{% url 'login' %}" style="font-weight: 600; color: #002569;">Login</a>
    </p>
</div>
{% endblock %}
